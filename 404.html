<title>Page not found – Semester HQ</title>
<link rel="icon" type="image/png" href="/assets/favicon.png">

<style>
  /* Served for any address that isn't a file, at any depth, so everything
     here is inline or absolute. Colours are the Bone & Ink palette. */
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: 24px 16px; background: #F8F6F2; color: #121212;
    font-family: 'General Sans', system-ui, -apple-system, sans-serif;
  }
  main { max-width: 440px; text-align: center; }
  .mark { font-family: 'Instrument Serif', Georgia, serif; font-size: 22px; margin: 0 0 40px; }
  .mark span { color: #B49F90; }
  h1 { font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 44px; line-height: 1.05; margin: 0 0 14px; }
  p { color: #7E736C; font-size: 16px; line-height: 1.55; margin: 0 0 28px; }
  a.btn {
    display: inline-block; padding: 12px 22px; border-radius: 999px;
    background: #121212; color: #F8F6F2; text-decoration: none; font-weight: 500; font-size: 15px;
  }
  a.btn:focus-visible { outline: 2px solid #9C8576; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <p class="mark">Semester HQ <span>✦</span></p>

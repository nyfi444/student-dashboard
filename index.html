<script>
  // Paint the chosen theme and app icon before anything else loads, so a
  // themed app never flashes the default colors (see applyTheme).
  try {
    var b = JSON.parse(localStorage.getItem('shq_boot_look') || 'null');
    if (b) {
      if (b.dark) document.documentElement.classList.add('dark');
      if (b.vars) for (var k in b.vars) document.documentElement.style.setProperty(k, b.vars[k]);
      if (b.icon) document.write('<link rel="apple-touch-icon" href="assets/icons/' + b.icon + '-180.png"><link rel="icon" type="image/png" href="assets/icons/' + b.icon + '-192.png">');
    }
  } catch (e) {}
</script>

<!-- ── Script order is load-bearing ───────────────────────────────────
     There is no build step, so this list IS the dependency graph and
     nothing enforces it. Every tag is `defer`, so the page paints its boot
     screen at once and the scripts still run in this order, after the
     document is parsed. Three rules, and one reordered line is a white
     screen on every device at once:
       1. js/version.js, js/config.js and js/diagnostics.js come first, in
          that order — diagnostics needs WORKER_URL and APP_VERSION, and it
          has to be listening before anything that can throw loads.
       2. js/utils.js, then js/state.js, then js/firebase.js: firebase.js
          syncs `state`, so state.js has to have defined it.
       3. js/app.js comes LAST. It boots the app and calls into every file
          above it.
     Everything between rule 2 and rule 3 is a feature and is order-free;
     add new ones there, not at either end. -->
<script defer src="js/version.js"></script>
<script defer src="js/config.js"></script>

<script defer src="js/utils.js"></script>

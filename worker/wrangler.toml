name = "student-planner-ai-proxy"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Restrict which origin(s) may call this Worker — a comma-separated list.
# Both the app (app.semester-hq.com) and the marketing site (semester-hq.com)
# call this Worker (AI + checkout). They're on genuinely different origins
# (different hostnames), so both need to be listed here.
[vars]
ALLOWED_ORIGIN = "https://semester-hq.com,https://app.semester-hq.com"

# The exact URL Stripe should redirect back to after checkout (your app's
# real URL).
APP_URL = "https://app.semester-hq.com/"

# Firebase project id (from Project settings — NOT secret, safe as a var).
FIREBASE_PROJECT_ID = "semester-hq"

# Where contact-form/group-pricing submissions get emailed (only sent at all
# once RESEND_API_KEY below is set — otherwise it's silently skipped and
# submissions still land in Firestore's `feedback` collection either way).
NOTIFY_EMAIL = "hello@semester-hq.com"
# Must be "onboarding@resend.dev" (Resend's shared sandbox sender) unless
# you've verified your own sending domain in Resend — see worker/README.md.
NOTIFY_FROM = "Semester HQ <onboarding@resend.dev>"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "c159c4afb7cc45619d6db5fd2fcde97d"

# The following are secrets, NOT set here — they never land in source
# control or this config file. Set each with:
#   wrangler secret put NAME
#
#   ANTHROPIC_API_KEY      — from https://console.anthropic.com
#   STRIPE_SECRET_KEY      — from https://dashboard.stripe.com/apikeys (starts with sk_)
#   STRIPE_WEBHOOK_SECRET  — from the webhook endpoint you create in the Stripe dashboard
#                            (Developers → Webhooks → Add endpoint → URL: this Worker's
#                            /stripe-webhook route, event: checkout.session.completed)
#   FIREBASE_CLIENT_EMAIL  — the "client_email" field from a Firebase service account key
#                            (Firebase console → Project settings → Service accounts →
#                            Generate new private key)
#   FIREBASE_PRIVATE_KEY   — the "private_key" field from that same service account key
#                            (paste it including the BEGIN/END lines; \n in the pasted
#                            value is handled automatically)
#   RESEND_API_KEY         — optional. From https://resend.com/api-keys (free tier is
#                            plenty for a contact form). Without this set, contact-form
#                            submissions still save to Firestore, just without an email.

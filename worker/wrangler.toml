name = "student-planner-ai-proxy"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Keeps console output (every logServerIssue call, with stacks) searchable in
# the Cloudflare dashboard under Workers → student-planner-ai-proxy → Logs.
# The error log in Firestore says something broke; this says exactly why.
[observability]
enabled = true

# Restrict which origin(s) may call this Worker: a comma-separated list.
# Both the app (app.semester-hq.com) and the marketing site (semester-hq.com)
# call this Worker (AI + checkout). They're on genuinely different origins
# (different hostnames), so both need to be listed here.
[vars]
ALLOWED_ORIGIN = "https://semester-hq.com,https://app.semester-hq.com"

# The exact URL Stripe should redirect back to after checkout (your app's
# real URL).
APP_URL = "https://app.semester-hq.com/"

# Firebase project id (from Project settings; NOT secret, safe as a var).
FIREBASE_PROJECT_ID = "semester-hq"
# Default Storage bucket (Firebase console → Storage). Public, like the project
# id; the service account's token is what allows deletes. Used only by
# "delete my account" to remove a person's syllabi and attachments.
FIREBASE_STORAGE_BUCKET = "semester-hq.firebasestorage.app"

# Where contact-form/group-pricing submissions get emailed (only sent at all
# once RESEND_API_KEY below is set, otherwise it's silently skipped and
# submissions still land in Firestore's `feedback` collection either way).
# Alerts (alerts.js) go here too. The person who filled in the form never
# hears from Resend: they're set as reply-to, so a reply from this inbox goes
# straight back to them. (Students do get sign-in links, receipts and the
# onboarding emails; those go to the student, see mail.js.)
#
# The sandbox restriction is gone now that send.semester-hq.com is verified,
# so this can be any address you actually read.
NOTIFY_EMAIL = "semesterhq@gmail.com"
# Must be an address at a domain verified in Resend. send.semester-hq.com was
# verified 2026-09-20: DKIM plus two CNAMEs, all unproxied, in Cloudflare.
#
# A subdomain on purpose. The apex already publishes an SPF record for Google
# Workspace, and a domain can only have one; adding a second would have broken
# mail to hello@semester-hq.com rather than adding to it. The DMARC policy on
# the apex uses relaxed alignment, so a subdomain sender still aligns.
NOTIFY_FROM = "Semester HQ <notifications@send.semester-hq.com>"
# Resend's daily sending limit for the plan we're on (free = 100). Every
# email shares it, sign-in links first; see worker/src/mail.js. Raise it the
# day the plan grows (Pro has no daily limit: use 1600, about 50,000/30).
RESEND_DAILY_LIMIT = "100"
# This Worker's own address, for the one-click unsubscribe link in emails.
SELF_URL = "https://student-planner-ai-proxy.semesterhq.workers.dev"
# Estimated Anthropic spend in a UTC day, in cents, that emails an alert.
AI_SPEND_ALERT_CENTS = "500"
# Nyla's own inboxes, which /admin/email-test may send to (?to=) for an
# inbox-placement check. Nobody else can be picked.
OWNER_TEST_EMAILS = "semesterhq@gmail.com,nylaiman@icloud.com,nnylabrown111@gmail.com"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "c159c4afb7cc45619d6db5fd2fcde97d"

# Cloudflare's own per-minute rate limiters (Workers Rate Limiting, GA since
# September 2025). Atomic and free of KV's one-write-per-second-per-key rule,
# which used to turn a busy campus network into 500s. checkRateLimit picks the
# smallest one at least as large as a route's limit and falls back to the KV
# namespace above when a binding is missing (local dev).
[[ratelimits]]
name = "RL_TIGHT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "RL_NORMAL"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "RL_LOOSE"
namespace_id = "1003"
simple = { limit = 60, period = 60 }

# The following are secrets, NOT set here; they never land in source
# control or this config file. Set each with:
#   wrangler secret put NAME
#
#   ANTHROPIC_API_KEY:     from https://console.anthropic.com
#   STRIPE_SECRET_KEY:     from https://dashboard.stripe.com/apikeys (starts with sk_)
#   STRIPE_WEBHOOK_SECRET: from the webhook endpoint you create in the Stripe dashboard
#                            (Developers → Webhooks → Add endpoint → URL: this Worker's
#                            /stripe-webhook route, event: checkout.session.completed)
#   FIREBASE_CLIENT_EMAIL: the "client_email" field from a Firebase service account key
#                            (Firebase console → Project settings → Service accounts →
#                            Generate new private key)
#   FIREBASE_PRIVATE_KEY:  the "private_key" field from that same service account key
#                            (paste it including the BEGIN/END lines; \n in the pasted
#                            value is handled automatically)
#   RESEND_API_KEY:        optional. From https://resend.com/api-keys (free tier is
#                            plenty for a contact form). Without this set, contact-form
#                            submissions still save to Firestore, just without an email.
#   ADMIN_TOKEN:           bearer token gating /admin/errors, /admin/business-summary and /admin/biz-events
#                            (the private business dashboard's data feed). Make up any
#                            long random string; paste the same value into the dashboard's
#                            Settings → Connectors panel.
#   CLOUDFLARE_API_TOKEN:  optional. A Cloudflare API token scoped to "Zone → Analytics →
#                            Read" for semester-hq.com only (create at
#                            https://dash.cloudflare.com/profile/api-tokens). Powers the
#                            Cloudflare traffic numbers on the business dashboard; the
#                            dashboard just shows "not connected" without it.
#   TURNSTILE_SECRET:      optional. The secret key of a Cloudflare Turnstile widget for
#                            semester-hq.com. Once set, the contact form, the group quote
#                            form, and the login page's email lookup require a Turnstile
#                            token (the pages render the widget when their sitekey is set).
#                            Unset, those routes work as before, with their rate limits.
#   CLOUDFLARE_ZONE_ID:    optional, required alongside CLOUDFLARE_API_TOKEN above. Find
#                            it on the semester-hq.com zone's Overview page in the
#                            Cloudflare dashboard (right sidebar, "Zone ID").

# Once a day at 13:00 UTC (9am ET): write what the business did overnight
# into the Business OS's inbox (buildBusinessEvents), and delete error reports
# older than 30 days (pruneOldIssues). Semester HQ sends no notifications, so
# there is no reminder sweep and nothing else needs a schedule.
[triggers]
crons = ["0 13 * * *"]

# ── Staging ─────────────────────────────────────────────────────────────
# The same code as a separate Worker, student-planner-ai-proxy-staging, for
# branch Previews, version URLs and localhost (js/config.js sends every
# host that isn't production here). Deploy with:
#   npx wrangler deploy --env staging
# Nothing here can reach a real student: its own Firebase project, Stripe
# in test mode, its own KV and rate limiters, and email only to the
# addresses in MAIL_ALLOWLIST. stagingProblem() in src/http.js refuses every
# request if any of that is ever not true (a live Stripe key, the production
# Firebase project, or no allow-list).
# Its secrets are its own, set with `npx wrangler secret put NAME --env staging`:
#   STRIPE_SECRET_KEY (sk_test_…), STRIPE_WEBHOOK_SECRET (the test-mode
#   endpoint's), FIREBASE_CLIENT_EMAIL and FIREBASE_PRIVATE_KEY (the staging
#   project's service account), ANTHROPIC_API_KEY (a separate key with a low
#   spend limit), RESEND_API_KEY, ADMIN_TOKEN, EMAIL_LINK_SECRET.
#   No TURNSTILE_SECRET: previews use Cloudflare's always-pass test widget.
[env.staging]
name = "student-planner-ai-proxy-staging"

[env.staging.observability]
enabled = true

[env.staging.vars]
STAGING = "1"
ALLOWED_ORIGIN = "https://*-semester-hq-app.semesterhq.workers.dev,https://*-semester-hq-site.semesterhq.workers.dev,http://localhost:7437,http://localhost:7438,http://localhost:7448,http://localhost:7449"
APP_URL = "https://staging-semester-hq-app.semesterhq.workers.dev/"
SITE_URL = "https://staging-semester-hq-site.semesterhq.workers.dev/"
FIREBASE_PROJECT_ID = "semester-hq-staging"
FIREBASE_STORAGE_BUCKET = "semester-hq-staging.firebasestorage.app"
NOTIFY_EMAIL = "semesterhq@gmail.com"
NOTIFY_FROM = "Semester HQ Staging <notifications@send.semester-hq.com>"
MAIL_ALLOWLIST = "semesterhq@gmail.com,hello@semester-hq.com,nnylabrown111@gmail.com,nylaiman@icloud.com"
# Its own small slice of the one Resend account, so testing can never use
# up the day that production's sign-in links need.
RESEND_DAILY_LIMIT = "12"
SELF_URL = "https://student-planner-ai-proxy-staging.semesterhq.workers.dev"
AI_SPEND_ALERT_CENTS = "100"

[[env.staging.kv_namespaces]]
binding = "RATE_LIMIT"
id = "204ce7f00642443ebeb67827964d8863"

[[env.staging.ratelimits]]
name = "RL_TIGHT"
namespace_id = "2001"
simple = { limit = 5, period = 60 }

[[env.staging.ratelimits]]
name = "RL_NORMAL"
namespace_id = "2002"
simple = { limit = 20, period = 60 }

[[env.staging.ratelimits]]
name = "RL_LOOSE"
namespace_id = "2003"
simple = { limit = 60, period = 60 }

[env.staging.triggers]
crons = ["0 13 * * *"]

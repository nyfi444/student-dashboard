<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'">
<title>Group plan – Semester HQ</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#141414">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<style>
  body { background: var(--bg); }
  .ga-page { max-width: 880px; margin: 0 auto; padding: 32px 20px 80px; }
  .ga-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 28px; }
  .ga-brand { font-family: var(--f-display, 'Instrument Serif', serif); font-size: 24px; letter-spacing: -0.01em; }
  .ga-brand span { opacity: .55; }
  .ga-title { font-family: var(--f-display, 'Instrument Serif', serif); font-size: 34px; line-height: 1.1; margin: 0 0 8px; }
  .ga-lede { color: var(--text-dim); font-size: 14px; max-width: 58ch; }
  .ga-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 22px; box-shadow: var(--shadow); margin-bottom: 18px; }
  .ga-stat-row { display: flex; flex-wrap: wrap; gap: 26px; align-items: flex-end; }
  .ga-stat b { display: block; font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
  .ga-stat span { font-size: 12.5px; color: var(--text-dim); }
  .ga-bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin-top: 14px; }
  .ga-bar i { display: block; height: 100%; background: var(--accent); }
  .ga-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 99px; background: var(--surface-2); color: var(--text-dim); }
  .ga-pill.live { background: var(--accent-light); color: var(--accent); }
  .ga-pill.warn { background: var(--warn-light); color: var(--warn); }
  .ga-invite { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .ga-invite input { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  .ga-members { width: 100%; border-collapse: collapse; }
  .ga-members th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-dim); font-weight: 600; padding: 0 10px 8px 0; }
  .ga-members td { padding: 10px 10px 10px 0; border-top: 1px solid var(--border); font-size: 13.5px; vertical-align: middle; }
  .ga-members td.ga-actions { text-align: right; white-space: nowrap; }
  .ga-empty { text-align: center; padding: 28px 16px; color: var(--text-dim); font-size: 13.5px; }
  .ga-seats { display: flex; align-items: center; gap: 10px; }
  .ga-seats input { width: 92px; text-align: center; }
  .ga-total { font-size: 13.5px; color: var(--text-dim); }
  .ga-total b { color: var(--text); font-weight: 600; }
  .ga-error { background: var(--warn-light); color: var(--warn); border-radius: 10px; padding: 10px 12px; font-size: 13px; margin-bottom: 16px; }
  .ga-plan-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
  .ga-foot { text-align: center; color: var(--text-dim); font-size: 12.5px; margin-top: 34px; }
  .ga-foot a { color: inherit; }
  @media (max-width: 820px) {
    .ga-members th:nth-child(2), .ga-members td:nth-child(2) { display: none; }
  }
  @media (max-width: 620px) {
    .ga-title { font-size: 27px; }
    .ga-members th:nth-child(3), .ga-members td:nth-child(3) { display: none; }
    .ga-members td.ga-actions .btn { padding: 4px 8px; }
  }
</style>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js" integrity="sha384-ZaR6mWzmJtrRibZ1Vm7SoHFr8OXjyAuGAXalGDKqbxFT18oi/z+oZLIRFkpeNor1" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js" integrity="sha384-I1LYojsZ5RM1cOda44Z2h42Qa6YfsQ1XkXxREnhp4ueYBR/4d1pG1K+NZM537Vsj" crossorigin="anonymous"></script>
</head>
<body>
<div class="ga-page">
  <div class="ga-top">
    <a class="ga-brand" href="index.html" style="text-decoration:none;color:inherit">Semester HQ <span>✦</span></a>
    <div id="ga-account"></div>
  </div>
  <div id="ga-root"><div class="ga-card"><div class="ga-empty">Checking your session…</div></div></div>
  <div class="ga-foot">
    <a href="index.html">← Back to Semester HQ</a> ·
    Questions about group plans? <a href="mailto:hello@semester-hq.com">hello@semester-hq.com</a> ·
    <a href="https://semester-hq.com/privacy.html">Privacy</a> ·
    <a href="https://semester-hq.com/terms.html">Terms</a>
  </div>
</div>
<div class="overlay" id="overlay" onclick="closeModal()"></div>
<div class="modal-wrap" id="modal-wrap"><div class="modal" id="modal" role="dialog" aria-modal="true" tabindex="-1"></div></div>
<div class="toast-stack" id="toast-stack" aria-live="polite"></div>
<script src="js/version.js"></script>
<script src="js/config.js"></script>
<script src="js/diagnostics.js"></script>
<script src="js/utils.js"></script>
<script src="js/icons.js"></script>
<script src="js/ui.js"></script>
<script src="js/group-admin.js"></script>
</body>
</html>

<script>
  // Same boot as index.html: the look applyTheme() last saved on this device
  // (dark, theme vars) so this page matches the app. No saved look means the
  // default Bone & Ink theme in light mode.
  try {
    var b = JSON.parse(localStorage.getItem('shq_boot_look') || 'null');
    if (b) {
      if (b.dark) document.documentElement.classList.add('dark');
      if (b.vars) for (var k in b.vars) document.documentElement.style.setProperty(k, b.vars[k]);
      var tc = document.querySelector('meta[name="theme-color"]');
      if (tc) tc.setAttribute('content', (b.vars && b.vars['--bg']) || (b.dark ? '#0f0f0f' : '#F8F6F2'));
    }
  } catch (e) {}
</script>
